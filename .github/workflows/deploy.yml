name: Deploy Lunar Landing Navigator to GitHub Pages

# Manual for now: the repository is private and GitHub Pages isn't enabled yet, so a run on every push would fail.
# Once Pages is on (Settings > Pages > Source: GitHub Actions), add:  push: { branches: [lunar-mission-planner] }
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24  # runs the .ts check script directly

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Verify engine parity (Horizons & Finder accuracy)
        working-directory: web
        run: npm run check:engine

      - name: Build static web distribution
        working-directory: web
        env:
          BASE_PATH: '/${{ github.event.repository.name }}/'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
